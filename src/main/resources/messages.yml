help-desc-create: 'Create a maze'
help-detail-create: 'Create a maze near you. Add width and depth to choose its size, or --preset to select a theme.'
help-desc-preview: 'See it before creating'
help-detail-preview: 'Preview the theme, layout and wall dimensions without changing terrain. Use the Create button when you are happy with it.'
help-desc-preview-stop: 'Close your preview'
help-detail-preview-stop: 'Remove your current preview. No terrain is changed.'
help-desc-presets: 'Choose a theme'
help-detail-presets: 'Compare themes and difficulty. Hover rows for details, then click one to preview it.'
help-desc-list: 'Browse saved mazes'
help-detail-list: 'List saved mazes. Hover for details and click a row to open its controls. Use the page buttons for longer lists.'
help-desc-info: 'Open maze controls'
help-detail-info: 'See a saved maze and its actions, including teleporting, enabling a guide and requesting deletion.'
help-desc-tp: 'Go to the maze'
help-detail-tp: 'Teleport to the saved teleport point, or the entrance if no custom point is set.'
help-desc-solve: 'Follow the way out'
help-detail-solve: 'Show private arrows along the shortest route to the exit. Only you can see your guide.'
help-desc-solve-stop: 'Close your guide'
help-detail-solve-stop: 'Remove your active guide. The maze itself stays unchanged.'
help-desc-setspawn: 'Save a teleport point'
help-detail-setspawn: 'Save where you are standing as the teleport destination. Stand on a safe solid floor with enough room above you.'
help-desc-setspawn-reset: 'Use the entrance again'
help-detail-setspawn-reset: 'Remove the custom teleport point. Future teleports use the generated entrance.'
help-desc-regenerate: 'Rebuild the maze'
help-detail-regenerate: 'Rebuild the saved maze. Use --repair to restore its structure without clearing passages. Repair preserves the seed and cannot be combined with --seed or --new-seed.'
help-desc-delete: 'Review maze deletion'
help-detail-delete: 'Open a deletion review with Delete and Cancel buttons. An available snapshot restores the original terrain; otherwise the region is cleared.'
help-desc-cancel: 'Cancel an operation'
help-detail-cancel: 'Cancel a running creation or edit. If editing has already started, the maze may need regeneration or snapshot restoration.'
help-desc-reload: 'Reload settings'
help-detail-reload: 'Reload messages, settings and presets. Saved mazes keep their existing geometry and palette.'
help-desc-help: 'Browse commands'
help-detail-help: 'Browse every command available to you. Use the page buttons or open Maze settings for explanations and examples.'
concept-name-seed: 'Seed'
concept-text-seed: 'A seed is a number that chooses the layout. Reusing it with the same size and preset reproduces the same maze. Omit it for a random layout.'
concept-name-complexity: 'Complexity'
concept-text-complexity: 'A value from 0 to 1. Higher values tend to create longer, more winding branches. It changes the layout, not the theme or wall dimensions.'
concept-name-cells: 'Cells'
concept-text-cells: 'Width and depth count maze cells, not individual Minecraft blocks. Wider paths and thicker walls make the same cell grid occupy more space.'
concept-name-geometry: 'Path and wall dimensions'
concept-text-geometry: 'Path width controls walking space. Wall thickness and wall height control the barriers. You can override these preset settings with command options.'
concept-name-preset: 'Presets and difficulty'
concept-text-preset: 'A preset selects the theme, dimensions and path style. Easy, Medium and Hard describe the intended challenge. Saved mazes keep their chosen settings.'
concept-name-connections: 'Routes and shortcuts'
concept-text-connections: 'Some themes have one route between any two cells. Others add loops and shortcuts. The guide always finds a shortest route to the exit.'
concept-name-placement: 'Placement modes'
concept-text-placement: 'CLEAR replaces the whole area. SAFE checks for free space first. REPLACE only permits configured block types. Players must leave the area before editing.'
concept-name-snapshot: 'Snapshots'
concept-text-snapshot: 'With WorldEdit installed, a snapshot saves the original blocks before editing. Deleting that maze can restore the original terrain. Snapshots are optional.'
concept-name-selection: 'WorldEdit selections'
concept-text-selection: 'Select a cuboid with WorldEdit, then use --selection. The plugin fits the largest cell grid and the chosen wall height inside that selection.'
concept-name-origin: 'World and position'
concept-text-origin: 'Without coordinates, the maze starts near you. Use --world, --x, --y and --z together to choose a location. Console creation requires all four options.'
