# Display name and difficulty are used as configured, independently of the filename.
display-name: Default
description: A balanced stone maze with a few tricky turns.
difficulty: MEDIUM
accent: "#B8C0D4"
# width/depth in commands are CELLS, not blocks.
# Physical span = cells * (path-width + wall-thickness) + wall-thickness.
path-width: 3
wall-thickness: 1
wall-height: 4
roof: false
snapshot: false
placement: CLEAR
algorithm: PERFECT
# 0..1; increasing complexity favors longer winding branches.
complexity: 0.7
# Optional controls replace values derived from complexity; omit to derive them.
# advanced:
#   branching: 0.195
#   turn-bias: 0.69
#   horizontal-bias: 0.5
#   braid-chance: 0.0  # Must be 0 for PERFECT; use algorithm: BRAIDED for loops.
palette:
  # Full Bukkit block-state syntax followed by @positive-weight.
  floor:
    - 'minecraft:polished_andesite@6'
    - 'minecraft:stone_bricks@3'
    - 'minecraft:cracked_stone_bricks@1'
  wall:
    - 'minecraft:stone_bricks@7'
    - 'minecraft:mossy_stone_bricks@2'
    - 'minecraft:cracked_stone_bricks@1'
  ceiling: ['minecraft:stone_bricks@1']
  cap: ['minecraft:polished_tuff@3', 'minecraft:chiseled_tuff@1']
decoration:
  # Top-wall accents and inset floor lighting never obstruct routes.
  cap-chance: 0.25
  light-spacing: 4
  light: minecraft:sea_lantern
  entrance-marker: minecraft:emerald_block
  exit-marker: minecraft:gold_block
